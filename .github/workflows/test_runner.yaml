
name: UI tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout test code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-xdist pytest-timeout allure-pytest
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Clone Practice Software Testing App
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: practice-app
          fetch-depth: 1

      - name: Set up QEMU for ARM images
        uses: docker/setup-qemu-action@v3

      - name: Configure local application
        working-directory: practice-app
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          else
            touch .env
          fi

          if grep -q '^SPRINT=' .env; then
            sed -i 's/^SPRINT=.*/SPRINT=sprint5/' .env
          else
            echo "SPRINT=sprint5" >> .env
          fi

          # Override the default Angular development configuration.
          # Google SSO is rendered only when environment.production is true.
          cat > docker-compose.ci.yml <<'YAML'
          services:
            angular-ui:
              command: >
                bash -c "ng serve --configuration production --host 0.0.0.0 --port 4200"
          YAML

          echo "=== Docker Compose configuration ==="
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml config

      - name: Spin Up Containers & Verify Services
        working-directory: practice-app
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            up -d --pull missing

          echo "Waiting for MariaDB..."

          until docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            exec -T mariadb \
            mysqladmin ping -h localhost -uroot -proot --silent; do
              sleep 2
          done

          echo "MariaDB is ready."

          # Configure Laravel API.
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            exec -u 0 -T laravel-api sh -c '
              set -e

              cd /var/www

              if [ ! -f .env ] && [ -f .env.example ]; then
                cp .env.example .env
              fi

              set_env() {
                key="$1"
                value="$2"

                if grep -q "^${key}=" .env; then
                  sed -i "s|^${key}=.*|${key}=${value}|" .env
                else
                  printf "%s=%s\n" "$key" "$value" >> .env
                fi
              }

              set_env DB_HOST mariadb

              chmod 666 .env
              chmod -R 777 storage bootstrap/cache
            '

          # Generate Laravel application key.
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            exec -T laravel-api \
            php artisan key:generate --force

          # Clear cached Laravel configuration.
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            exec -T laravel-api \
            php artisan config:clear

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            exec -T laravel-api \
            php artisan cache:clear

          # Initialize database.
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            exec -T laravel-api \
            php artisan migrate:fresh --seed --force

          echo "=== Container status ==="

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            ps

      - name: Wait for Angular application
        run: |
          echo "Waiting for Angular production configuration..."

          for i in $(seq 1 90); do
            if curl -fsS http://localhost:4200/ > /dev/null; then
              echo "Angular application is responding."
              exit 0
            fi

            sleep 2
          done

          echo "ERROR: Angular application did not start."
          exit 1

      - name: Run tests with Allure
        env:
          # Always test the locally deployed application.
          BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091

          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}

          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

          USER_EMAIL_ACCOUNT_LOCKOUT: ${{ secrets.USER_EMAIL_ACCOUNT_LOCKOUT }}
          USER_PASSWORD_ACCOUNT_LOCKOUT: ${{ secrets.USER_PASSWORD_ACCOUNT_LOCKOUT }}

          API_USER: ${{ secrets.API_USER }}
          API_USER_PASSWORD: ${{ secrets.API_USER_PASSWORD }}

          PYTEST_ADDOPTS: "--color=yes"
          PYTHONPATH: "."

        run: |
          mkdir -p allure-results

          pytest -v \
            --tb=short \
            --durations=0 \
            --timeout=60 \
            -n 4 \
            --alluredir=allure-results

      - name: Debug Docker Containers and Logs
        if: failure()
        run: |
          cd practice-app

          echo "=== CONTAINER STATUS ==="

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            ps

          echo "=== LARAVEL API LOGS ==="

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            logs --tail=200 laravel-api

          echo "=== ANGULAR UI LOGS ==="

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            logs --tail=200 angular-ui

          echo "=== NGINX WEB LOGS ==="

          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            logs --tail=200 web

      - name: Stop and Clean Up Docker Containers
        if: always()
        run: |
          if [ -d practice-app ]; then
            cd practice-app

            docker compose \
              -f docker-compose.prod.yml \
              -f docker-compose.ci.yml \
              down -v --remove-orphans || true
          fi

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Allure Environment File
        if: always()
        run: |
          mkdir -p allure-results

          cat << EOF > allure-results/environment.properties
          Platform=GitHub Actions
          Python_Version=3.11
          Base_URL=http://localhost:4200
          API_URL=http://localhost:8091
          Branch=${{ github.ref_name }}
          Runner_OS=Ubuntu Latest
          Execution_ID=${{ github.run_id }}
          EOF

      - name: Generate Custom Allure Categories
        if: always()
        run: |
          mkdir -p allure-results

          cat << 'EOF' > allure-results/categories.json
          [
            {
              "name": "Ignored/Skipped Tests",
              "matchedStatuses": ["skipped"]
            },
            {
              "name": "Infrastructure & Gateway Defects",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*(TimeoutError|502 Bad Gateway|504 Gateway Timeout|ConnectionRefusedError).*"
            },
            {
              "name": "Product Defects (Assertion Failures)",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*AssertionError.*"
            }
          ]
          EOF

      - name: Load Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 1

      - name: Generate Allure Report
        if: always()
        run: |
          if ! command -v allure &> /dev/null; then
            npm install -g allure-commandline
          fi

          # Restore previous trend history.
          if [ -d "gh-pages-dir/history" ]; then
            mkdir -p allure-results/history
            cp -a gh-pages-dir/history/. allure-results/history/
          fi

          # Generate current report.
          allure generate allure-results --clean -o allure-report

          # Create directory for this execution.
          mkdir -p "allure-history/${{ github.run_number }}"

          cp -a allure-report/. "allure-history/${{ github.run_number }}/"

          # Preserve latest history for subsequent executions.
          mkdir -p allure-history/history

          if [ -d allure-report/history ]; then
            cp -a allure-report/history/. allure-history/history/
          fi

          # Root redirect to latest report.
          cat << 'EOF' > allure-history/index.html
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; URL=./${{ github.run_number }}/">
          <meta name="robots" content="noindex">
          <title>Redirecting to latest Allure report...</title>
          <a href="./${{ github.run_number }}/">Click here if not redirected</a>
          EOF

          touch allure-history/.nojekyll

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          commit_message: "Update Allure report for run ${{ github.run_number }}"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Workflow: ${{ github.workflow }}
            Status: ${{ job.status }}
            Actor: ${{ github.actor }}
            Commit: ${{ github.event.head_commit && github.event.head_commit.message || 'Manual run' }}
            Repository: ${{ github.repository }}
            Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            View report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html
