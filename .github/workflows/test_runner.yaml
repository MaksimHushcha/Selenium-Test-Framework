name: UI tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest allure-pytest pytest-xdist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Clone Practice Software Testing App
        uses: actions/checkout@v4
        with:
          repository: 'testsmith-io/practice-software-testing'
          path: 'practice-app'


      - name: Spin Up App Containers from Source
        run: |
          cd practice-app
          echo "SPRINT=sprint5" > .env
          docker compose up -d
          sleep 15
          

          docker compose exec -T laravel-api php artisan key:generate
          docker compose exec -T laravel-api php artisan config:clear
          docker compose exec -T laravel-api php artisan cache:clear
          
          docker compose exec -T laravel-api php artisan migrate:fresh --seed
          
          docker compose exec -T laravel-api chmod -R 777 storage bootstrap/cache

      - name: Debug Docker Containers and Logs
        if: always()
        run: |
          cd practice-app
          echo "=== CONTAINER STATUS ==="
          docker compose -f docker-compose.prod.yml ps
          
          echo "=== LARAVEL API LOGS ==="
          docker compose -f docker-compose.prod.yml logs laravel-api
          
          echo "=== NGINX WEB LOGS ==="
          docker compose -f docker-compose.prod.yml logs web

      - name: Run tests with Allure
        env:
          BASE_URL: ${{ secrets.BASE_URL}}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          PYTEST_ADDOPTS: "--color=yes"
          PYTHONPATH: "."
        run: pytest -v --tb=short --durations=10 --maxfail=5 -n 1 --alluredir=allure-results
        continue-on-error: true

      - name: Stop and Clean Up Docker Containers
        if: always()
        run: |
          cd practice-app
          docker compose down

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Generate Allure Environment File
        if: always()
        run: |
          mkdir -p allure-results
          echo "Platform=GitHub Actions" > allure-results/environment.properties
          echo "Python_Version=3.11" >> allure-results/environment.properties
          echo "Base_URL=${{ secrets.BASE_URL }}" >> allure-results/environment.properties
          echo "Branch=${{ github.ref_name }}" >> allure-results/environment.properties
          echo "Runner_OS=Ubuntu Latest" >> allure-results/environment.properties
          echo "Execution_ID=${{ github.run_id }}" >> allure-results/environment.properties

      - name: Generate Custom Allure Categories
        if: always()
        run: |
          mkdir -p allure-results
          cat << 'EOF' > allure-results/categories.json
          [
            {
              "name": "Ignored/Skipped Tests",
              "matchedStatuses": ["skipped"]
            },
            {
              "name": "Infrastructure & Gateway Defects",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*(TimeoutError|502 Bad Gateway|504 Gateway Timeout|ConnectionRefusedError).*"
            },
            {
              "name": "Product Defects (Assertion Failures)",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*AssertionError.*"
            }
          ]
          EOF

      - name: Load Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Generate Allure Report Natively
        if: always()
        run: |
          npm install -g allure-commandline --save-dev
  
          if [ -d "gh-pages-dir/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-dir/history/* allure-results/history/
          fi
  
          allure generate allure-results --clean -o allure-report
  
          mkdir -p allure-history
          if [ -d "allure-report/history" ]; then
            cp -r allure-report/history/* allure-history/
          fi
          cp -r allure-report/* allure-history/

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          commit_message: "Update Allure report for run ${{ github.run_number }}"

      - name: Wait for GitHub Pages deployment
        if: always()
        run: sleep 60

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Workflow: ${{ github.workflow }}
            Status: ${{ job.status }} 
            Actor: ${{ github.actor }}
            Commit: ${{ github.event.head_commit && github.event.head_commit.message || 'Manual run' }}
            Repository: ${{ github.repository }}
            Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            View report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html