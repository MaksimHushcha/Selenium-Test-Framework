name: UI tests

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest allure-pytest pytest-xdist
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Clone Practice Software Testing App
        uses: actions/checkout@v4
        with:
          repository: 'testsmith-io/practice-software-testing'
          path: 'practice-app'
          fetch-depth: 1

      - name: Set up QEMU for ARM images
        uses: docker/setup-qemu-action@v3

      - name: Spin Up Containers & Verify Services
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          cd practice-app
          if [ -f .env.example ]; then cp .env.example .env; fi
          echo "SPRINT=sprint5" >> .env

          docker compose -f docker-compose.prod.yml up -d

          echo "Waiting for MariaDB..."
          until docker compose -f docker-compose.prod.yml exec -T mariadb mysqladmin ping -h localhost -uroot -proot --silent; do
            sleep 2
          done

          docker compose -f docker-compose.prod.yml exec -u 0 -T laravel-api sh -c "
            if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi
            sed -i 's/DB_HOST=127.0.0.1/DB_HOST=mariadb/g' .env
            sed -i 's/DB_HOST=localhost/DB_HOST=mariadb/g' .env
          
            # Inject dummy Google OAuth credentials so the frontend button renders
            echo 'APP_GOOGLE_ID=dummy-google-client-id.apps.googleusercontent.com' >> .env
            echo 'APP_GOOGLE_SECRET=dummy-google-client-secret' >> .env
          
            chmod 666 .env
            chmod -R 777 storage bootstrap/cache
          "

          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan key:generate
          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan config:clear
          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan cache:clear
          docker compose -f docker-compose.prod.yml exec -T laravel-api php artisan migrate:fresh --seed --force

          # Check container status
          docker compose -f docker-compose.prod.yml ps

      - name: Debug Docker Containers and Logs
        if: failure()
        run: |
          cd practice-app
          echo "=== CONTAINER STATUS ==="
          docker compose -f docker-compose.prod.yml ps
          
          echo "=== LARAVEL API LOGS ==="
          docker compose -f docker-compose.prod.yml logs laravel-api
          
          echo "=== NGINX WEB LOGS ==="
          docker compose -f docker-compose.prod.yml logs web

      - name: Run tests with Allure
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          USER_EMAIL_ACCOUNT_LOCKOUT: ${{ secrets.USER_EMAIL_ACCOUNT_LOCKOUT }}
          USER_PASSWORD_ACCOUNT_LOCKOUT: ${{ secrets.USER_PASSWORD_ACCOUNT_LOCKOUT }}
          API_USER: ${{ secrets.API_USER }}
          API_USER_PASSWORD: ${{ secrets.API_USER_PASSWORD }}

          PYTEST_ADDOPTS: "--color=yes"
          PYTHONPATH: "."
        run: pytest -v --tb=short --durations=0 --timeout=60 -n 4 --alluredir=allure-results
        continue-on-error: true

      - name: Stop and Clean Up Docker Containers
        if: always()
        run: |
          cd practice-app
          docker compose -f docker-compose.prod.yml down -v

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      - name: Generate Allure Environment File
        if: always()
        run: |
          mkdir -p allure-results
          cat << EOF > allure-results/environment.properties
          Platform=GitHub Actions
          Python_Version=3.11
          Base_URL=${{ secrets.BASE_URL }}
          Branch=${{ github.ref_name }}
          Runner_OS=Ubuntu Latest
          Execution_ID=${{ github.run_id }}
          EOF

      - name: Generate Custom Allure Categories
        if: always()
        run: |
          mkdir -p allure-results
          cat << 'EOF' > allure-results/categories.json
          [
            {
              "name": "Ignored/Skipped Tests",
              "matchedStatuses": ["skipped"]
            },
            {
              "name": "Infrastructure & Gateway Defects",
              "matchedStatuses": ["broken"],
              "messageRegex": ".*(TimeoutError|502 Bad Gateway|504 Gateway Timeout|ConnectionRefusedError).*"
            },
            {
              "name": "Product Defects (Assertion Failures)",
              "matchedStatuses": ["failed"],
              "messageRegex": ".*AssertionError.*"
            }
          ]
          EOF

      - name: Load Allure history from gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir
          fetch-depth: 1

      - name: Generate Allure Report Natively
        if: always()
        run: |
          if ! command -v allure &> /dev/null; then
            npm install -g allure-commandline --save-dev
          fi
      
          # 1. Pull previous history into results to keep trend graphs
          if [ -d "gh-pages-dir/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-dir/history/* allure-results/history/
          fi
      
          # 2. Generate current report
          allure generate allure-results --clean -o allure-report
      
          # 3. Create run directory and copy this run's report
          mkdir -p "allure-history/${{ github.run_number }}"
          cp -r allure-report/* "allure-history/${{ github.run_number }}/"
      
          # 4. Save latest history for future runs
          mkdir -p allure-history/history
          cp -r allure-report/history/* allure-history/history/
      
          # 5. Root redirect to the latest run
          cat << 'EOF' > allure-history/index.html
          <!DOCTYPE html>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; URL=./${{ github.run_number }}/">
          <meta name="robots" content="noindex">
          <title>Redirecting to latest Allure report...</title>
          <a href="./${{ github.run_number }}/">Click here if not redirected</a>
          EOF
      
          # 6. Prevent GitHub Pages from ignoring special files
          touch allure-history/.nojekyll

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
          commit_message: "Update Allure report for run ${{ github.run_number }}"

      - name: Send Telegram Notification
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Workflow: ${{ github.workflow }}
            Status: ${{ job.status }} 
            Actor: ${{ github.actor }}
            Commit: ${{ github.event.head_commit && github.event.head_commit.message || 'Manual run' }}
            Repository: ${{ github.repository }}
            Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            View report: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ github.run_number }}/index.html